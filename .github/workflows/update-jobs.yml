name: Automated Startup Jobs Scraper & Deploy

on:
  schedule:
    # Run every 48 hours at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Startup Jobs Crawler
        run: python scraper/crawler.py

      - name: Commit and push updated job feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified Hyderabad job postings"
            git push origin HEAD:main
          fi

  deploy:
    needs: scrape-and-deploy
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
