name: Twice-Weekly Jobs Sync & Deploy

on:
  schedule:
    # Run every Monday and Thursday at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Sync & Refresh Jobs Dataset
        run: node scripts/sync-jobs.mjs

      - name: Build Portal
        run: npm run build

      - name: Copy Dist to Docs
        run: cp -r dist/* docs/

      - name: Commit & Push Updated Jobs Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Automated twice-weekly jobs refresh [skip ci]"
          git push origin main
