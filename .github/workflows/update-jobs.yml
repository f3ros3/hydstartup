name: Automated Startup Jobs Scraper & Deploy

on:
  schedule:
    # Run every 48 hours at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Startup Jobs Crawler
        run: python scraper/crawler.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Portal
        run: npm run build

      - name: Copy Dist to Docs
        run: cp -r dist/* docs/

      - name: Commit & Push Updated Jobs Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Automated 48-hour startup jobs crawl & feed update [skip ci]"
          git push origin main

